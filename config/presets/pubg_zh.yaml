# PUBG Mobile / 和平精英 — 简体中文击杀检测预设
meta:
  name: "PUBG Mobile 简体中文"
  game: "PUBG Mobile"
  language: "zh_CN"
  version: "1.0.0"

descriptors:
  - "精确打击"
  - "爆头"
  - "命中头部"

trigger_prefixes:
  - "你使用"
  - "你的队友"
  - "你被"
  - "你引爆"

rules:
  # === 自己击杀 ===
  - id: kill_self
    actor: "自己"
    actor_signal: "你使用"
    action: "淘汰"
    match_strategy: exact

  - id: knockdown_self
    actor: "自己"
    actor_signal: "你使用"
    action: "击倒"
    match_strategy: exact

  # === 队友被击杀 ===
  - id: teammate_killed_headshot
    actor: "敌人"
    actor_signal: "你的队友"
    require_signal: "被"
    action: "击倒"
    descriptors_override: ["命中头部"]
    require_descriptor: true
    match_strategy: fuzzy
    similarity_threshold: 0.80

  - id: teammate_killed
    actor: "敌人"
    actor_signal: "你的队友"
    require_signal: "被"
    action: "淘汰"
    match_strategy: fuzzy
    similarity_threshold: 0.80

  - id: teammate_knocked
    actor: "敌人"
    actor_signal: "你的队友"
    require_signal: "被"
    action: "击倒"
    match_strategy: fuzzy
    similarity_threshold: 0.80

  # === 自己载具击杀 ===
  - id: kill_self_vehicle
    actor: "自己"
    actor_signal: "你引爆"
    action: "淘汰"
    match_strategy: exact

  - id: knockdown_self_vehicle
    actor: "自己"
    actor_signal: "你引爆"
    action: "击倒"
    match_strategy: exact

  # === 自己被淘汰 ===
  - id: killed_self
    actor: "敌人"
    actor_signal: "你被"
    action: "淘汰"
    match_strategy: fuzzy
    similarity_threshold: 0.80

  - id: knocked_self
    actor: "敌人"
    actor_signal: "你被"
    action: "击倒"
    match_strategy: fuzzy
    similarity_threshold: 0.80

  # === 队友击杀 ===
  - id: kill_teammate
    actor: "队友"
    actor_signal: "你的队友"
    anti_signal: "被"
    action: "淘汰"
    match_strategy: exact

  - id: knockdown_teammate
    actor: "队友"
    actor_signal: "你的队友"
    anti_signal: "被"
    action: "击倒"
    match_strategy: exact
