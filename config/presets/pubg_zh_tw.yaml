# PUBG Mobile / 絕地求生 — 繁體中文擊殺檢測預設
meta:
  platform: "mobile"
  name: "PUBG Mobile 繁體中文"
  game: "PUBG Mobile"
  language: "zh_TW"
  version: "1.0.0"

descriptors:
  - "精確打擊"
  - "爆頭"
  - "命中頭部"

trigger_prefixes:
  - "你使用"
  - "你的隊友"
  - "你被"
  - "你引爆"

rules:
  # === 自己擊殺 ===
  - id: kill_self
    actor: "自己"
    actor_signal: "你使用"
    action: "淘汰"
    match_strategy: exact

  - id: knockdown_self
    actor: "自己"
    actor_signal: "你使用"
    action: "擊倒"
    match_strategy: exact

  # === 隊友被擊殺 ===
  - id: teammate_killed_headshot
    actor: "敵人"
    actor_signal: "你的隊友"
    require_signal: "被"
    action: "擊倒"
    descriptors_override: ["命中頭部"]
    require_descriptor: true
    match_strategy: fuzzy
    similarity_threshold: 0.80

  - id: teammate_killed
    actor: "敵人"
    actor_signal: "你的隊友"
    require_signal: "被"
    action: "淘汰"
    match_strategy: fuzzy
    similarity_threshold: 0.80

  - id: teammate_knocked
    actor: "敵人"
    actor_signal: "你的隊友"
    require_signal: "被"
    action: "擊倒"
    match_strategy: fuzzy
    similarity_threshold: 0.80

  # === 自己載具擊殺 ===
  - id: kill_self_vehicle
    actor: "自己"
    actor_signal: "你引爆"
    action: "淘汰"
    match_strategy: exact

  - id: knockdown_self_vehicle
    actor: "自己"
    actor_signal: "你引爆"
    action: "擊倒"
    match_strategy: exact

  # === 自己被淘汰 ===
  - id: killed_self
    actor: "敵人"
    actor_signal: "你"
    require_signal: "被"
    action: "淘汰"
    match_strategy: fuzzy
    similarity_threshold: 0.80

  - id: knocked_self
    actor: "敵人"
    actor_signal: "你"
    require_signal: "被"
    action: "擊倒"
    match_strategy: fuzzy
    similarity_threshold: 0.80

  # === 隊友擊殺 ===
  - id: kill_teammate
    actor: "隊友"
    actor_signal: "你的隊友"
    anti_signal: "被"
    action: "淘汰"
    match_strategy: exact

  - id: knockdown_teammate
    actor: "隊友"
    actor_signal: "你的隊友"
    anti_signal: "被"
    action: "擊倒"
    match_strategy: exact
