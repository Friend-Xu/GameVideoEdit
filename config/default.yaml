app:
  name: GameVideoEdit
  version: 1.0.3
  language: zh_CN
ocr:
  engine: easyocr
  gpu: true
  languages:
  - ch_sim
  - en
  confidence_threshold: 0.5
detection:
  mode: time
  interval_sec: 1.0
  skip_frames: 15
  post_detect_skip_sec: 0.3
  padding_before: 5.0
  padding_after: 5.0
  merge_gap: 30.0
  num_threads: 4
  rotation: 0
  pipeline_mode: pool
  cpu_workers: 6
  gpu_workers: 4
  refine_boundaries: false
  refine_search_window: 2.0
  cell_divide: true
  cell_min_gap: 2.0
  gate_mode: neural
event_stack:
  wait_after:
    淘汰: 10.0
    击倒: 30.0
    counter: 10.0
    淘汰:队友: 3.0
    击倒:队友: 3.0
    淘汰:敌人: 5.0
    击倒:敌人: 5.0
export:
  ffmpeg_path: ffmpeg
  default_encoder: auto
  output_format: mp4
  quality: 23
  reencode: false
ui:
  theme: light
  language: zh_CN
  default_window_size:
  - 1200
  - 800
advanced:
  scene_detection: false
  audio_analysis: false
  yolo_auto_roi: false
