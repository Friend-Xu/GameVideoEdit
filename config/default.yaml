# GameVideoEdit 默认配置
# 用户可通过 %APPDATA%/GameVideoEdit/user_config.yaml 覆盖

app:
  name: "GameVideoEdit"
  version: "2.0.0"
  language: "zh_CN"

ocr:
  engine: "easyocr"
  gpu: true
  languages: ["ch_sim", "en"]
  confidence_threshold: 0.5

detection:
  keyword_file: "keywords.yaml"
  padding_before: 10.0
  padding_after: 10.0
  merge_overlap: true
  max_gap_seconds: 30.0

export:
  ffmpeg_path: "ffmpeg"
  default_encoder: "auto"
  output_format: "mp4"
  quality: 23

ui:
  theme: "light"
  language: "zh_CN"
  default_window_size: [1200, 800]

advanced:
  scene_detection: false
  audio_analysis: false
  yolo_auto_roi: false
