# 和平精英击杀检测关键词配置（信号拆解格式）

# 全局描述词 — 游戏更新改这里即可
descriptors:
  - "精确打击"   # 新版本
  - "爆头"       # 旧版本
  - "命中头部"   # 旧版本变体

# 触发前缀(OCR文本必须包含以下任一项才进入匹配)
trigger_prefixes:
  - "你使用"
  - "你的队友"
  - "你被"
  - "你引爆"

rules:
  # === 自己击杀 ===
  - id: kill_self
    actor: "自己"
    actor_signal: "你使用"
    action: "淘汰"

  - id: knockdown_self
    actor: "自己"
    actor_signal: "你使用"
    action: "击倒"

  # === 队友被击杀（require_signal 优先级最高） ===
  - id: teammate_killed_headshot
    actor: "敌人"
    actor_signal: "你的队友"
    require_signal: "被"
    action: "击倒"
    descriptors_override: ["命中头部"]
    require_descriptor: true

  - id: teammate_killed
    actor: "敌人"
    actor_signal: "你的队友"
    require_signal: "被"
    action: "淘汰"

  - id: teammate_knocked
    actor: "敌人"
    actor_signal: "你的队友"
    require_signal: "被"
    action: "击倒"

  # === 自己载具击杀 ===
  - id: kill_self_vehicle
    actor: "自己"
    actor_signal: "你引爆"
    action: "淘汰"

  - id: knockdown_self_vehicle
    actor: "自己"
    actor_signal: "你引爆"
    action: "击倒"

  # === 自己被淘汰 ===
  - id: killed_self
    actor: "敌人"
    actor_signal: "你被"
    action: "淘汰"

  - id: knocked_self
    actor: "敌人"
    actor_signal: "你被"
    action: "击倒"

  # === 队友击杀（anti_signal 排除"被"） ===
  - id: kill_teammate
    actor: "队友"
    actor_signal: "你的队友"
    anti_signal: "被"
    action: "淘汰"

  - id: knockdown_teammate
    actor: "队友"
    actor_signal: "你的队友"
    anti_signal: "被"
    action: "击倒"
