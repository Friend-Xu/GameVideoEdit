# 和平精英击杀检测关键词配置

patterns:
  # === 自己击杀 ===
  - id: kill_self
    regex: "你使用了(\\S+)淘汰了(\\S+)"
    action: "击杀"
    actor: "自己"
    extract: [weapon, target]

  - id: knockdown_self
    regex: "你使用了(\\S+)击倒了(\\S+)"
    action: "击倒"
    actor: "自己"
    extract: [weapon, target]

  # === 队友击杀 ===
  - id: kill_teammate
    regex: "你的队友(\\S+)使用了(\\S+)淘汰了(\\S+)"
    action: "击杀"
    actor: "队友"
    extract: [teammate, weapon, target]

  - id: knockdown_teammate
    regex: "你的队友(\\S+)使用了(\\S+)击倒了(\\S+)"
    action: "击倒"
    actor: "队友"
    extract: [teammate, weapon, target]

  # === 队友被击杀 ===
  - id: teammate_killed_headshot
    regex: "你的队友(\\S+)被(\\S+)使用(\\S+)命中头部击倒了"
    action: "被爆头击倒"
    actor: "敌人"
    extract: [teammate, enemy, weapon]

  - id: teammate_killed
    regex: "你的队友(\\S+)被(\\S+)使用(\\S+)淘汰了"
    action: "被击杀"
    actor: "敌人"
    extract: [teammate, enemy, weapon]

  - id: teammate_knocked
    regex: "你的队友(\\S+)被(\\S+)使用(\\S+)击倒了"
    action: "被击倒"
    actor: "敌人"
    extract: [teammate, enemy, weapon]

  # === 通用兜底 ===
  - id: kill_generic
    regex: ".*淘汰了(\\S+)"
    action: "击杀"
    actor: "未知"
    extract: [target]

  - id: knockdown_generic
    regex: ".*击倒了(\\S+)"
    action: "击倒"
    actor: "未知"
    extract: [target]

# 触发前缀(OCR文本必须包含以下任一项才进入匹配)
trigger_prefixes:
  - "你使用"
  - "你的队友"
  - "你被"
